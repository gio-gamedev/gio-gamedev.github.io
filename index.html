<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0e17" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Theme before first paint: the saved choice, else the system setting.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f5fb' : '#0f0e17');
      })();
    </script>
    <!-- Replaced per language by scripts/prerender.mjs (title, description, Open Graph, hreflang, JSON-LD). -->
    <!--head:start-->
    <title>Giovanni S. Mariano — Game QA Analyst</title>
    <!--head:end-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
