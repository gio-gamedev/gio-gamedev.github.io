name: Check links

# Store pages get delisted; this flags broken project and profile links once a month.
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          # 403/429: Fortnite and some stores block bots, which is not a broken link.
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,206,403,429
            'src/**/*.ts'
            'src/**/*.tsx'
            README.md
          fail: true
