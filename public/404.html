<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Giovanni S. Mariano</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f0e17;
        --text: #eeedf7;
        --muted: #b4b1cb;
        --border: #433e68;
        --accent: #9d8cff;
        --on-accent: #0f0e17;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f6f5fb;
          --text: #17151f;
          --muted: #4a4661;
          --border: #c4c0d8;
          --accent: #5b47d6;
          --on-accent: #ffffff;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .code {
        margin: 0;
        font-family: Consolas, ui-monospace, monospace;
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        color: var(--accent);
      }
      h1 {
        margin: 0.6rem 0 0.9rem;
        font-size: clamp(1.6rem, 5vw, 2.4rem);
      }
      p {
        margin: 0.25rem 0;
        color: var(--muted);
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 1.75rem;
      }
      a {
        display: inline-block;
        padding: 0.7rem 1.1rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-weight: 600;
        text-decoration: none;
      }
      a.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--on-accent);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">QA-404 · SEVERITY: LOW · PAGE NOT FOUND</p>
      <h1>This page doesn't exist.</h1>
      <p lang="pt-BR">Esta página não existe.</p>
      <div class="links">
        <a class="primary" href="/">Go to the portfolio</a>
        <a href="/pt/" lang="pt-BR">Ir para o portfólio</a>
      </div>
    </main>
  </body>
</html>
